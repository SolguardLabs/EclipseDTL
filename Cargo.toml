[package]
name = "eclipsedtl"
version = "1.0.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
description = "Liquidity auction, operator capital and deterministic settlement engine for DTL routes"

[lib]
name = "eclipsedtl"
path = "src/lib.rs"

[[bin]]
name = "eclipsedtl"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
pretty_assertions = "1.4"
